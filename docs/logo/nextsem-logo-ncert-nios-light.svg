<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#04AA6D" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Light Mode Container -->
  <rect x="10" y="8" width="100" height="64" rx="16" fill="#ffffff" stroke="#04AA6D" stroke-width="2.5" filter="url(#lightGlow)" />
  
  <!-- N (Emerald Green) -->
  <path d="M 32 56 V 24 L 52 56 V 24" fill="none" stroke="#04AA6D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- S (Deep Slate / Dark Charcoal for crisp light contrast) -->
  <path d="M 88 32 C 88 23, 68 23, 68 34 C 68 44, 88 44, 88 54 C 88 64, 68 64, 68 56" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />

  <!-- NEXTSEM Brand Text (Deep Slate) -->
  <text x="60" y="89" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" letter-spacing="1.2">NEXTSEM</text>

  <!-- NCERT NIOS Tagline (Emerald Green) -->
  <text x="60" y="104" text-anchor="middle" fill="#04AA6D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="6.5" font-weight="800" letter-spacing="1">NCERT • NIOS SOLUTIONS</text>
</svg>
