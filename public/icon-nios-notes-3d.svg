<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Clipboard Gradient -->
    <linearGradient id="clipBoardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <!-- Metallic Clamp Gradient -->
    <linearGradient id="clampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Wooden Ruler Gradient -->
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="practiceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#practiceShadow)">
    <!-- ═══ CLIPBOARD BASE ═══ -->
    <g transform="rotate(-6 100 100)">
      <!-- Board Body -->
      <rect x="36" y="32" width="126" height="142" rx="16" fill="url(#clipBoardGrad)" stroke="#a855f7" stroke-width="2"/>
      
      <!-- Inner Paper Base -->
      <rect x="44" y="44" width="110" height="122" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

      <!-- Practice Checklist Items -->
      <!-- Item 1 -->
      <rect x="54" y="60" width="12" height="12" rx="3" fill="rgba(4, 170, 109, 0.15)" stroke="#04AA6D" stroke-width="1.5"/>
      <path d="M 57 66 L 60 69 L 68 62" fill="none" stroke="#04AA6D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="72" y1="64" x2="140" y2="64" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="72" y1="70" x2="120" y2="70" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Item 2 -->
      <rect x="54" y="80" width="12" height="12" rx="3" fill="rgba(4, 170, 109, 0.15)" stroke="#04AA6D" stroke-width="1.5"/>
      <path d="M 57 86 L 60 89 L 68 82" fill="none" stroke="#04AA6D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="72" y1="84" x2="140" y2="84" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="72" y1="90" x2="110" y2="90" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Item 3 -->
      <rect x="54" y="100" width="12" height="12" rx="3" fill="rgba(4, 170, 109, 0.15)" stroke="#04AA6D" stroke-width="1.5"/>
      <path d="M 57 106 L 60 109 L 68 102" fill="none" stroke="#04AA6D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="72" y1="104" x2="135" y2="104" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="72" y1="110" x2="115" y2="110" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Item 4 (100% Score Tag) -->
      <rect x="54" y="124" width="86" height="24" rx="6" fill="#04AA6D" fill-opacity="0.12" stroke="#04AA6D" stroke-width="1"/>
      <text x="97" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#04AA6D">100% MASTERY</text>

      <!-- Top Metal Clip -->
      <rect x="74" y="24" width="50" height="20" rx="6" fill="url(#clampGrad)" stroke="#334155" stroke-width="1.5"/>
      <ellipse cx="99" cy="30" rx="6" ry="3" fill="#1e293b"/>
    </g>

    <!-- ═══ RULER & STYLUS PEN (Diagonal Overlay) ═══ -->
    <!-- Wooden Ruler -->
    <g transform="translate(112, 60) rotate(22)">
      <rect x="0" y="0" width="18" height="96" rx="4" fill="url(#rulerGrad)" stroke="#c2410c" stroke-width="1"/>
      <!-- Measurement Ticks -->
      <line x1="0" y1="12" x2="8" y2="12" stroke="#7c2d12" stroke-width="1"/>
      <line x1="0" y1="24" x2="12" y2="24" stroke="#7c2d12" stroke-width="1.5"/>
      <line x1="0" y1="36" x2="8" y2="36" stroke="#7c2d12" stroke-width="1"/>
      <line x1="0" y1="48" x2="12" y2="48" stroke="#7c2d12" stroke-width="1.5"/>
      <line x1="0" y1="60" x2="8" y2="60" stroke="#7c2d12" stroke-width="1"/>
      <line x1="0" y1="72" x2="12" y2="72" stroke="#7c2d12" stroke-width="1.5"/>
      <line x1="0" y1="84" x2="8" y2="84" stroke="#7c2d12" stroke-width="1"/>
    </g>

    <!-- Stylus Pen -->
    <g transform="translate(138, 70) rotate(32)">
      <rect x="0" y="0" width="8" height="80" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
      <path d="M 0 80 L 4 92 L 8 80 Z" fill="#0f172a"/>
      <circle cx="4" cy="91" r="1" fill="#cbd5e1"/>
    </g>
  </g>
</svg>
