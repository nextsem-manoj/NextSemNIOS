<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Notebook Cover Gradient -->
    <linearGradient id="notesCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="emeraldNotesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#04AA6D"/>
    </linearGradient>

    <!-- Metallic Pen Gradient -->
    <linearGradient id="penMetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="penGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#c1a648"/>
    </linearGradient>

    <filter id="notesShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#notesShadow)">
    <!-- ═══ NOTEBOOK BASE & COVER ═══ -->
    <!-- Bottom Cover Base -->
    <rect x="36" y="44" width="128" height="124" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Paper Sheet (Clean Crisp Light Page) -->
    <rect x="42" y="40" width="120" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Notebook Ruled / Grid Lines -->
    <line x1="68" y1="62" x2="152" y2="62" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="68" y1="80" x2="152" y2="80" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="68" y1="98" x2="152" y2="98" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="68" y1="116" x2="152" y2="116" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="68" y1="134" x2="152" y2="134" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Left Margin Line (Emerald) -->
    <line x1="62" y1="40" x2="62" y2="160" stroke="#04AA6D" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Handwritten Formulas / Notes Content -->
    <text x="70" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#0284c7">E = mc²</text>
    <text x="70" y="76" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#04AA6D">∫ f(x) dx</text>
    <text x="70" y="94" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#475569">PV = nRT</text>

    <!-- Formula Step Box -->
    <rect x="68" y="104" width="76" height="38" rx="6" fill="rgba(4, 170, 109, 0.08)" stroke="#04AA6D" stroke-width="1"/>
    <text x="74" y="118" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#04AA6D">Step 1: Formula</text>
    <text x="74" y="132" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#334155">ΔH = -572 kJ</text>

    <!-- ═══ SPIRAL RINGS (Left Edge) ═══ -->
    <g fill="#94a3b8" stroke="#475569" stroke-width="0.8">
      <ellipse cx="44" cy="52" rx="6" ry="3" fill="#cbd5e1"/>
      <ellipse cx="44" cy="68" rx="6" ry="3" fill="#cbd5e1"/>
      <ellipse cx="44" cy="84" rx="6" ry="3" fill="#cbd5e1"/>
      <ellipse cx="44" cy="100" rx="6" ry="3" fill="#cbd5e1"/>
      <ellipse cx="44" cy="116" rx="6" ry="3" fill="#cbd5e1"/>
      <ellipse cx="44" cy="132" rx="6" ry="3" fill="#cbd5e1"/>
      <ellipse cx="44" cy="148" rx="6" ry="3" fill="#cbd5e1"/>
    </g>

    <!-- ═══ METALLIC FOUNTAIN PEN (Diagonal) ═══ -->
    <g transform="translate(100, 75) rotate(-35)">
      <!-- Pen Shadow -->
      <rect x="8" y="12" width="70" height="9" rx="4" fill="#000000" fill-opacity="0.3"/>
      
      <!-- Pen Barrel -->
      <rect x="10" y="0" width="48" height="9" rx="2" fill="url(#penMetalGrad)" stroke="#475569" stroke-width="0.8"/>
      
      <!-- Gold Band Ring -->
      <rect x="36" y="0" width="5" height="9" fill="url(#penGoldGrad)"/>
      
      <!-- Pen Grip -->
      <rect x="58" y="1.5" width="14" height="6" rx="1" fill="#0f172a"/>
      
      <!-- Gold Nib -->
      <path d="M 72 1.5 L 85 4.5 L 72 7.5 Z" fill="url(#penGoldGrad)" stroke="#b45309" stroke-width="0.5"/>
      <line x1="72" y1="4.5" x2="82" y2="4.5" stroke="#78350f" stroke-width="0.5"/>

      <!-- Pen Clip -->
      <rect x="12" y="-2" width="24" height="2" rx="1" fill="url(#penGoldGrad)"/>
    </g>
  </g>
</svg>
