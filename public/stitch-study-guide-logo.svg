<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d33" />
      <stop offset="50%" stop-color="#051424" />
      <stop offset="100%" stop-color="#020b14" />
    </linearGradient>
    <linearGradient id="greenNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#04aa6d" />
    </linearGradient>
    <linearGradient id="cyanDivider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="50%" stop-color="#00dce6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="8" y="8" width="384" height="224" rx="24" fill="url(#bgGlow)" stroke="#1a2e45" stroke-width="2" />
  <rect x="10" y="10" width="380" height="220" rx="22" fill="none" stroke="rgba(0, 230, 118, 0.2)" stroke-width="1" />

  <!-- Top Monogram & Subtitle: NS ribbon + NextSem -->
  <g transform="translate(145, 24)">
    <rect x="0" y="0" width="28" height="28" rx="7" fill="#04aa6d" fill-opacity="0.2" stroke="#00e676" stroke-width="1.5" />
    <path d="M7 21 V7 L21 21 V7" stroke="#00e676" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
    <text x="36" y="19" fill="#00e676" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">NEXTSEM</text>
  </g>

  <!-- Primary Centerpiece: STUDY GUIDE -->
  <text x="200" y="112" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="2">STUDY GUIDE</text>

  <!-- Luminescent Divider Bar -->
  <rect x="50" y="132" width="300" height="3" rx="1.5" fill="url(#cyanDivider)" filter="url(#glow)" />

  <!-- Bottom Curriculum Badge: NCERT & NIOS -->
  <g transform="translate(110, 154)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#0c1e31" stroke="#00dce6" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="4" fill="#00e676" />
    <text x="100" y="22" text-anchor="middle" fill="#d4e4fa" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">NCERT &amp; NIOS</text>
  </g>
</svg>