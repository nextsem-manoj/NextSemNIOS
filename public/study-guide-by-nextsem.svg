<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="60%" stop-color="#050b14" />
      <stop offset="100%" stop-color="#02050a" />
    </radialGradient>

    <!-- Golden Aura Gradient -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="50%" stop-color="#ffa751" />
      <stop offset="100%" stop-color="#f39c12" />
    </linearGradient>

    <!-- Neon Emerald / Cyan Gradient -->
    <linearGradient id="neonCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#04aa6d" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="goldAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Backdrop -->
  <rect x="12" y="12" width="488" height="488" rx="88" fill="url(#bgGrad)" stroke="rgba(255, 215, 0, 0.25)" stroke-width="2.5" />

  <!-- Ambient Light Behind Book -->
  <circle cx="256" cy="200" r="140" fill="#ffa751" opacity="0.12" filter="url(#goldAura)" />
  <circle cx="256" cy="230" r="110" fill="#00e676" opacity="0.15" filter="url(#softGlow)" />

  <!-- Academic Graduation Cap (Top) -->
  <g transform="translate(256, 102)" filter="url(#goldAura)">
    <!-- Mortarboard Diamond -->
    <polygon points="0,-32 78,0 0,32 -78,0" fill="none" stroke="url(#goldGlow)" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Cap Crown -->
    <path d="M -44 14 C -44 38, 44 38, 44 14" fill="none" stroke="url(#goldGlow)" stroke-width="4" stroke-linecap="round" />
    <!-- Tassel -->
    <circle cx="0" cy="0" r="4.5" fill="#ffe259" />
    <path d="M 0 0 Q 38 12, 46 42" fill="none" stroke="#ffe259" stroke-width="3" stroke-linecap="round" />
    <polygon points="43,42 49,42 46,55" fill="#ffe259" />
  </g>

  <!-- Illuminated 3D Open Textbook -->
  <g transform="translate(256, 240)">
    <!-- Outer Book Cover Spines -->
    <path d="M -145 -70 C -145 35, -135 75, 0 102 C 135 75, 145 35, 145 -70" fill="none" stroke="url(#neonCyanEmerald)" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <path d="M -155 -60 C -155 45, -145 88, 0 114 C 145 88, 155 45, 155 -60" fill="none" stroke="url(#neonCyanEmerald)" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

    <!-- Left Book Pages -->
    <path d="M 0 95 C -120 70, -135 40, -135 -65 C -75 -40, -35 -45, 0 -35 Z" fill="#081829" stroke="url(#goldGlow)" stroke-width="3" stroke-linejoin="round" />
    <path d="M -20 -15 C -60 -20, -100 -22, -120 -40" fill="none" stroke="url(#goldGlow)" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <path d="M -20 15 C -60 12, -95 10, -118 -10" fill="none" stroke="url(#goldGlow)" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <path d="M -20 45 C -60 42, -95 40, -115 20" fill="none" stroke="url(#goldGlow)" stroke-width="2" opacity="0.6" stroke-linecap="round" />

    <!-- Right Book Pages -->
    <path d="M 0 95 C 120 70, 135 40, 135 -65 C 75 -40, 35 -45, 0 -35 Z" fill="#081829" stroke="url(#goldGlow)" stroke-width="3" stroke-linejoin="round" />
    <path d="M 20 -15 C 60 -20, 100 -22, 120 -40" fill="none" stroke="url(#goldGlow)" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <path d="M 20 15 C 60 12, 95 10, 118 -10" fill="none" stroke="url(#goldGlow)" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <path d="M 20 45 C 60 42, 95 40, 115 20" fill="none" stroke="url(#goldGlow)" stroke-width="2" opacity="0.6" stroke-linecap="round" />

    <!-- Central Spine Spine Flare -->
    <line x1="0" y1="-35" x2="0" y2="102" stroke="url(#goldGlow)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Monogram Emblem (SG / NS) Inside Book -->
    <g transform="translate(0, 10)" filter="url(#softGlow)">
      <!-- S curve -->
      <path d="M -45 -18 C -25 -32, 5 -18, -10 5 C -25 28, 5 36, 35 22" fill="none" stroke="url(#neonCyanEmerald)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <!-- G / N loop -->
      <path d="M 15 -25 L 45 30 L 45 -25 L 58 -25" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    </g>
  </g>

  <!-- Typography: StudyGuide -->
  <text x="256" y="420" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.03em">
    StudyGuide
  </text>

  <!-- Typography: BY NEXTSEM -->
  <text x="256" y="458" text-anchor="middle" fill="#00e676" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="800" letter-spacing="0.22em">
    BY NEXTSEM
  </text>
</svg>