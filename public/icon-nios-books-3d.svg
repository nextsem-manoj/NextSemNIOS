<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Leather Book Gradient -->
    <linearGradient id="niosLeatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Mortarboard Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="goldTassel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="niosShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#niosShadow)">
    <!-- ═══ OPEN BOOK BASE ═══ -->
    <g transform="translate(0, 30)">
      <!-- Leather Outer Cover (Left & Right Wings) -->
      <path d="M 28 80 Q 64 88, 100 80 Q 136 88, 172 80 L 176 116 Q 136 124, 100 116 Q 64 124, 24 116 Z" fill="url(#niosLeatherGrad)" stroke="#78350f" stroke-width="1.5"/>

      <!-- Stacked Page Thickness Layers -->
      <path d="M 32 78 Q 64 85, 100 78 Q 136 85, 168 78 L 172 110 Q 136 118, 100 110 Q 64 118, 28 110 Z" fill="#cbd5e1"/>

      <!-- White Open Pages (Top Surface) -->
      <!-- Left Page -->
      <path d="M 34 76 Q 66 82, 98 76 L 98 106 Q 66 112, 34 106 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Right Page -->
      <path d="M 102 76 Q 134 82, 166 76 L 166 106 Q 134 112, 102 106 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Page Text Simulating Lines -->
      <line x1="42" y1="84" x2="88" y2="84" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="42" y1="91" x2="88" y2="91" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="42" y1="98" x2="78" y2="98" stroke="#cbd5e1" stroke-width="1"/>

      <line x1="112" y1="84" x2="158" y2="84" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="112" y1="91" x2="158" y2="91" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="112" y1="98" x2="148" y2="98" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Center Spine Crease (Gold Ribbon) -->
      <line x1="100" y1="74" x2="100" y2="114" stroke="#d4af37" stroke-width="2"/>
    </g>

    <!-- ═══ 3D GRADUATION CAP (Mortarboard) ═══ -->
    <g transform="translate(0, -6)">
      <!-- Cap Skull Base -->
      <ellipse cx="100" cy="62" rx="34" ry="14" fill="#090d16" stroke="#1e293b" stroke-width="1"/>

      <!-- Diamond Mortarboard Top (Isometric) -->
      <polygon points="100,24 162,44 100,64 38,44" fill="url(#capGrad)" stroke="#334155" stroke-width="1.5"/>

      <!-- Top Button (Emerald Accent) -->
      <circle cx="100" cy="44" r="4.5" fill="#04AA6D" stroke="#10b981" stroke-width="1"/>

      <!-- Gold Tassel Ribbon & Fringes -->
      <path d="M 100 44 Q 130 46, 142 62" fill="none" stroke="url(#goldTassel)" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Tassel Brush/Fringe -->
      <path d="M 142 62 L 140 76 L 148 76 L 144 62 Z" fill="url(#goldTassel)"/>
      <circle cx="143" cy="63" r="2.5" fill="#d4af37"/>
    </g>
  </g>
</svg>
