  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // ═══════════════════════════════════════════════════════════════════════
      // 🚀 REAL-TIME LIVE UPDATE & CACHE INVALIDATION ENGINE
      // ═══════════════════════════════════════════════════════════════════════
      if ('serviceWorker' in navigator) {
        let refreshing = false;

        // Auto-refresh when new service worker takes control
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log('[StudyGuide Auto-Update] Active version updated — refreshing app...');
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[StudyGuide PWA] Service Worker registered:', reg.scope);
              window.__NEXTSEM_SW_REG__ = reg;

              // Check for update immediately on launch
              reg.update().catch(() => {});

              // Periodic update check every 60 seconds
              setInterval(() => {
                reg.update().catch(() => {});
              }, 60000);

              // If a waiting worker already exists, prompt it to take control
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }

              // Listen for newly installed service workers
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[StudyGuide PWA] New update ready — applying...');
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            })
            .catch((err) => console.warn('[StudyGuide PWA] SW registration notice:', err));
        });

        // Trigger update check when user returns to tab / unlocks phone
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && window.__NEXTSEM_SW_REG__) {
            window.__NEXTSEM_SW_REG__.update().catch(() => {});
          }
        });
      }
    </script>
  </body>
